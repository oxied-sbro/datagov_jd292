[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oxied-sbro-datagov_jd292"
version = "0.1.0"
description = "解析时间标记，排列数据治理与血缘专家·提示注入的跨轮传播的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "oxied-sbro" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://oxied-sbro.github.io"
Repository = "https://github.com/oxied-sbro/datagov_jd292"
Issues = "https://github.com/oxied-sbro/datagov_jd292/issues"

[project.scripts]
datagov_jd292 = "datagov_jd292:main"

[tool.setuptools]
py-modules = ["datagov_jd292"]
